concurrency:
  cancel-in-progress: false
  group: 'pages'
jobs:
  pages:
    environment:
      name: 'github-pages'
      url: '${{ steps.deployment.outputs.page_url }}'
    name: 'Deploy'
    permissions:
      contents: 'read'
      id-token: 'write'
      pages: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Setup Pages'
        uses: 'actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d'
      - name: 'Install Doxygen and Graphviz'
        run: 'sudo apt-get update && sudo apt-get install --no-install-recommends -y doxygen graphviz'
      - name: 'Configure'
        run: 'cmake -S . -B build -DBUILD_DOCS=ON'
      - name: 'Build documentation'
        run: 'cmake --build build --target docs'
      # Inline equivalent of actions/upload-pages-artifact: that action pulls in
      # actions/upload-artifact by tag, which this repo's SHA-pinning policy rejects.
      - name: 'Archive documentation for Pages'
        run: 'tar --dereference --hard-dereference -cvf "${RUNNER_TEMP}/artifact.tar" -C build/html --exclude=.git --exclude=.github .'
      - name: 'Upload Pages artifact'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'github-pages'
          path: '${{ runner.temp }}/artifact.tar'
          retention-days: '1'
      - id: 'deployment'
        name: 'Deploy to GitHub Pages'
        uses: 'actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346'
name: 'GitHub Pages'
'on':
  push:
    branches:
      - 'master'
permissions: {}
